<div class="dashboard">

    <!-- Sidebar -->

    <aside class="sidebar">

        <div class="logo">
            🏦 <span>Bank Customer</span>
        </div>

        <nav>

            <a routerLink="/customerdashboard">Dashboard</a>

            <a routerLink="/profile">View Profile</a>

            <a routerLink="/deposit">Deposit</a>

            <a routerLink="/withdraw">Withdraw</a>

            <a routerLink="/transfermoney">Transfer Money</a>

            <a routerLink="/transactionhistory">Transaction History</a>

            <a routerLink="/transferhistory">Transfer History</a>

            <a routerLink="/changepassword" class="active">
                Change Password
            </a>

        </nav>

        <button class="logout">
            Logout
        </button>

    </aside>

    <!-- Main Content -->

    <main class="content">

        <div class="header">

            <h1>Change Password</h1>

            <p>Update your account password securely</p>

        </div>

        <div class="password-card">

            <div class="icon">
                🔒
            </div>

            <h2>Update Password</h2>

            <div class="form-group">

                <label>Current Password</label>

                <input
                    type="password"
                    [(ngModel)]="oldPassword"
                    placeholder="Enter current password">

            </div>

            <div class="form-group">

                <label>New Password</label>

                <input
                    type="password"
                    [(ngModel)]="newPassword"
                    placeholder="Enter new password">

            </div>

            <div class="form-group">

                <label>Confirm Password</label>

                <input
                    type="password"
                    [(ngModel)]="confirmPassword"
                    placeholder="Confirm new password">

            </div>

            <div class="buttons">

                <button
                    class="change-btn"
                    (click)="changePassword()">

                    Change Password

                </button>

                <button
                    class="reset-btn"
                    (click)="reset()">

                    Reset

                </button>

            </div>

        </div>

    </main>

</div>
