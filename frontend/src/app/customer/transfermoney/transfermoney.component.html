<div class="dashboard">

    <!-- Sidebar -->

    <aside class="sidebar">

        <div class="logo">
            🏦 <span>Bank Customer</span>
        </div>

        <nav>

            <a routerLink="/customerdashboard">Dashboard</a>

            <a routerLink="/profile">View Profile</a>

            <a routerLink="/deposit">Deposit</a>

            <a routerLink="/withdraw">Withdraw</a>

            <a routerLink="/transfermoney" class="active">
                Transfer Money
            </a>

            <a routerLink="/transactionhistory">Transaction History</a>

            <a routerLink="/transferhistory">Transfer History</a>

            <a routerLink="/changepassword">Change Password</a>

        </nav>

        <button class="logout">
            Logout
        </button>

    </aside>

    <!-- Main Content -->

    <main class="content">

        <div class="header">

            <h1>Transfer Money</h1>

            <p>Transfer money securely to another account</p>

        </div>

        <div class="transfer-card">

            <div class="icon">
                💳
            </div>

            <h2>Money Transfer</h2>

            <div class="form-group">

                <label>Recipient Account Number</label>

                <input
                    type="number"
                    [(ngModel)]="toAccount"
                    placeholder="Enter account number">

            </div>

            <div class="form-group">

                <label>Transfer Amount</label>

                <input
                    type="number"
                    [(ngModel)]="amount"
                    placeholder="Enter amount">

            </div>

            <div class="buttons">

                <button
                    class="transfer-btn"
                    (click)="transferMoney()">

                    Transfer

                </button>

                <button
                    class="clear-btn"
                    (click)="toAccount=0; amount=0">

                    Clear

                </button>

            </div>

        </div>

    </main>

</div>
